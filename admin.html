<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイナステン 管理ページ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: wide admin column; same silver / charcoal / orange identity as the stylist app */
:root{
  --bg:#ffffff;--surface:#f2f2f1;--line:#e1e0dd;--fg:#262523;--muted:#76746f;
  --ink:#3a3936;--accent:#d9621f;--orange:#ed6a1f;--good:#4f7a52;--warn:#b5533c;--silver-a:#8e8e8d;--silver-b:#e9e9e8;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--surface:#1f1f1e;--line:#363634;--fg:#efeeeb;--muted:#a6a39e;--ink:#ecebe7;--accent:#ff8b4d;--orange:#ff7a33;--good:#86b489;--warn:#e08a74;--silver-a:#4a4a49;--silver-b:#262625;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 48px}
[hidden]{display:none!important}
img{max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:14px;min-width:0}
.top .logo{height:22px;width:auto}
@media (prefers-color-scheme:dark){.top .logo{filter:brightness(2.1)}}
.top h1{font-size:20px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px 12px;width:100%}
.login{max-width:380px;margin:48px auto 0;display:grid;gap:14px}
.note{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:13px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-block:20px}
.kpi{padding:14px 16px;border-radius:6px;background:var(--surface)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:600}
.kpi small{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--orange)}
.sec{display:grid;gap:12px;padding-block:8px 24px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:18px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface)}
.sid{font-weight:700}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;border:1px solid}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.mid{color:var(--accent);border-color:var(--accent)}
.pill.off{color:var(--muted);border-color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px}
.tab[aria-pressed="true"]{border-color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--orange)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.tools{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcard{display:grid;gap:8px;padding:10px;border-radius:8px;background:linear-gradient(180deg,var(--silver-a),var(--silver-b));min-width:0}
.gpair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gph{position:relative;aspect-ratio:3/4;background:#f1eee8;overflow:hidden}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.gph .lab{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:2px 12px;border-radius:6px;background:rgba(255,255,255,.85);color:#2a2926;font-family:var(--f-display);font-size:14px;font-weight:600}
.gph .none{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#8a877f}
.chev{position:absolute;left:calc(50% - 13px);top:calc(50% - 15px);width:26px;height:30px;z-index:2}
.gcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-inline:2px}
.gcap b{font-family:var(--f-display);font-size:14px;color:var(--fg)}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.back{justify-self:start;background:none;border:0;padding:0;color:var(--accent);font-size:14px}
.loading{color:var(--muted);font-size:13px}
</style>
</head>

<script>
(function(){
const FIREBASE_CONFIG={apiKey:"AIzaSyDLmfVd_NB2jhf1JW0bYU3LV-Nn4I7It_8",authDomain:"minusten-record.firebaseapp.com",projectId:"minusten-record",storageBucket:"minusten-record.firebasestorage.app",messagingSenderId:"580936800601",appId:"1:580936800601:web:53448d29ba99ad97031448"};
const DOMAIN="salon.youforio.com",FB="10.14.1",PHOTO_LIMIT=4000;
const ANGLES=[["back","バック"],["right","右サイド"],["left","左サイド"]],ANG=Object.fromEntries(ANGLES);
const CHEV='<svg class="chev" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 3l9 12-9 12h6l9-12L8 3z" fill="#ed6a1f"/><path d="M11 3l9 12-9 12h6l9-12-9-12z" fill="#ed6a1f"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>{const p=String(s||"").split("-");return p.length===3?(+p[1])+"/"+(+p[2]):"-"};
const fmtDate=t=>{if(!t)return"-";const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
const daysSince=t=>t?Math.floor((Date.now()-t)/864e5):null;
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
let db,auth,DATA=null,cur=null,galAngle="back",showNames=false,pendingMsg=null;

function statusPill(t){const d=daysSince(t);if(d==null)return'<span class="pill off">未使用</span>';if(d<=7)return'<span class="pill good">よく使用</span>';if(d<=30)return'<span class="pill mid">ときどき</span>';return'<span class="pill off">止まっている</span>'}

function showLogin(msg){
  $("#logout").hidden=true;
  $("#main").innerHTML=`<form class="login" id="lf"><div><div class="eyebrow">Youforio Admin</div><h2 style="font-size:22px">管理者ログイン</h2></div>
    <div class="field"><label for="aid">管理者ID</label><input id="aid" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="admin"></div>
    <div class="field"><label for="apw">パスワード</label><input id="apw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="lb" type="submit">ログイン</button>
    <p class="err" id="le" ${msg?"":"hidden"}>${esc(msg||"")}</p>
    <p class="note">このページはユーフォリオの管理者専用です。サロンの写真は閲覧のみで、ここから変更や削除はできません。</p></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const id=$("#aid").value.trim(),pw=$("#apw").value,b=$("#lb");
    b.disabled=true;b.textContent="ログインしています…";
    try{await auth.signInWithEmailAndPassword(id.includes("@")?id:`${id}@ais.com`,pw)}
    catch(err){const c=err&&err.code||"";b.disabled=false;b.textContent="ログイン";const le=$("#le");le.hidden=false;le.textContent=/network/.test(c)?"インターネットにつながっているか確認してください。":"管理者IDかパスワードが違います。"}};
}

async function loadAll(){
  $("#main").innerHTML='<p class="loading" style="margin-top:24px">サロンのデータを集めています…</p>';
  const salons=await db.collection("salons").get();
  const rows=await Promise.all(salons.docs.map(async d=>{
    const x=d.data()||{},base=d.ref;
    const [cs,vs]=await Promise.all([base.collection("customers").get(),base.collection("visits").get()]);
    const customers={};cs.forEach(c=>customers[c.id]={id:c.id,name:(c.data()||{}).name||"",visits:[]});
    let photos=0,lastVisit="";
    vs.forEach(v=>{const y=v.data()||{};const ang=y.angles||[];photos+=ang.length;if((y.date||"")>lastVisit)lastVisit=y.date||"";
      const c=customers[y.customerId];if(c)c.visits.push({id:v.id,date:y.date||"",before:!!y.before,angles:ang,created:y.created||0})});
    Object.values(customers).forEach(c=>c.visits.sort((a,b)=>((b.before?1:0)-(a.before?1:0))||(a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0))));
    return {uid:d.id,loginId:x.loginId||"(ID未記録)",salonName:x.salonName||"",lastActive:x.lastActive||0,lastVisit,customers:Object.values(customers),visitCount:vs.size,photos};
  }));
  rows.sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
  DATA=rows;
}

function renderHome(){
  cur=null;const R=DATA,tot=k=>R.reduce((s,r)=>s+(typeof k==="function"?k(r):r[k]),0);
  const photos=tot("photos"),pct=Math.min(100,Math.round(photos/PHOTO_LIMIT*100)),active=R.filter(r=>daysSince(r.lastActive)!=null&&daysSince(r.lastActive)<=30).length;
  $("#main").innerHTML=`
  <section class="kpis">
    <div class="kpi"><span>サロン数</span><b class="num">${R.length}</b><small>　うち30日以内に使用 ${active}</small></div>
    <div class="kpi"><span>お客様の合計</span><b class="num">${tot(r=>r.customers.length)}</b><small>名</small></div>
    <div class="kpi"><span>来店記録の合計</span><b class="num">${tot("visitCount")}</b><small>回分</small></div>
    <div class="kpi"><span>写真の枚数（無料枠の目安 ${PHOTO_LIMIT.toLocaleString()}枚）</span><b class="num">${photos.toLocaleString()}</b><small>　${pct}%</small><div class="meter"><i style="width:${pct}%"></i></div></div>
  </section>
  <section class="sec"><div class="sec-head"><h2>サロン一覧</h2><span class="note">最後に使った日が新しい順。行を押すと写真を見られます。</span></div>
    ${R.length?`<div class="tbl"><table><thead><tr><th>サロンID</th><th>サロン名</th><th>状況</th><th class="r">お客様</th><th class="r">来店記録</th><th class="r">写真</th><th>最後に使った日</th><th>最後の施術日</th></tr></thead><tbody>
    ${R.map((r,i)=>`<tr data-i="${i}" tabindex="0"><td class="sid">${esc(r.loginId)}</td><td>${esc(r.salonName)||'<span class="muted">未設定</span>'}</td><td>${statusPill(r.lastActive)}</td><td class="r num">${r.customers.length}</td><td class="r num">${r.visitCount}</td><td class="r num">${r.photos}</td><td class="num">${fmtDate(r.lastActive)}</td><td class="num">${r.lastVisit?r.lastVisit.replace(/-/g,"/"):"-"}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">まだサロンのデータがありません。サロンがアプリでログインすると、ここに表示されます。</div>`}
    <p class="note">「止まっている」は30日以上使われていないサロンです。フォローの連絡の目安にしてください。</p>
  </section>`;
  document.querySelectorAll("tr[data-i]").forEach(tr=>{const go=()=>openSalon(DATA[+tr.dataset.i]);tr.onclick=go;tr.onkeydown=e=>{if(e.key==="Enter")go()}});
}

const photoCache={};
function getPhoto(uid,vid,a){const k=uid+"/"+vid+"_"+a;if(!photoCache[k])photoCache[k]=db.collection("salons").doc(uid).collection("photos").doc(vid+"_"+a).get().then(d=>d.exists?(d.data()||{}).data:null).catch(()=>null);return photoCache[k]}
function pairsFor(r,a){const out=[];r.customers.forEach(c=>{const vs=c.visits;const ai=vs.findIndex(v=>v.angles.includes(a));let bi=-1;for(let i=vs.length-1;i>ai;i--){if(vs[i].angles.includes(a)){bi=i;break}}
  if(ai>=0&&bi>=0){const lab=i=>vs[i].before?"ビフォア":vs.slice(0,i+1).filter(v=>!v.before).length+"回目";out.push({c,A:vs[ai],B:vs[bi],la:lab(ai),lb:lab(bi)})}});
  return out.sort((x,y)=>x.B.date<y.B.date?1:x.B.date>y.B.date?-1:0)}
function openSalon(r){
  cur=r;const items=pairsFor(r,galAngle);
  $("#main").innerHTML=`<section class="sec" style="padding-top:18px">
    <button class="back" id="bk">← サロン一覧に戻る</button>
    <div class="sec-head"><div><div class="eyebrow">${esc(r.loginId)}</div><h2 style="font-size:22px">${esc(r.salonName)||esc(r.loginId)}</h2></div>
      <span class="note num">お客様 ${r.customers.length}名・来店記録 ${r.visitCount}回分・最後に使った日 ${fmtDate(r.lastActive)}</span></div>
    <div class="tools"><div class="tabs">${ANGLES.map(([a,l])=>`<button class="tab" data-a="${a}" aria-pressed="${a===galAngle}">${l}</button>`).join("")}</div>
      <label class="chk"><input type="checkbox" id="nm" ${showNames?"checked":""}> お客様のお名前を表示</label></div>
    ${items.length?`<div class="gal">${items.map((x,i)=>`<div class="gcard"><div class="gpair"><div class="gph" id="pa${i}"><span class="none">読み込み中…</span><span class="lab">Before</span></div>${CHEV}<div class="gph" id="pb${i}"><span class="none">読み込み中…</span><span class="lab">After</span></div></div>
      <div class="gcap"><b>${x.la} → ${x.lb}</b><span class="num">${showNames?esc(x.c.name)+" 様・":""}${md(x.A.date)} → ${md(x.B.date)}</span></div></div>`).join("")}</div>`
      :`<div class="empty">この方向で2回以上撮影したお客様はまだいません。</div>`}
    <p class="note">各お客様の最初の写真と最新の写真を並べています。閲覧のみで、ここから変更はできません。</p></section>`;
  $("#bk").onclick=renderHome;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{galAngle=b.dataset.a;openSalon(r)});
  $("#nm").onchange=e=>{showNames=e.target.checked;openSalon(r)};
  items.forEach((x,i)=>{[["pa",x.A],["pb",x.B]].forEach(([k,v])=>getPhoto(r.uid,v.id,galAngle).then(src=>{if(cur!==r)return;const el=$("#"+k+i);if(!el)return;
    el.querySelector(".none").remove();if(src)el.insertAdjacentHTML("afterbegin",`<img src="${src}" alt="" loading="lazy">`);else el.insertAdjacentHTML("afterbegin",'<span class="none">写真なし</span>')}))});
  scrollTo(0,0);
}

(async()=>{
  try{const b=`https://www.gstatic.com/firebasejs/${FB}/`;await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js")}
  catch(e){$("#main").innerHTML='<p class="err" style="margin-top:24px">読み込めませんでした。インターネットの接続を確認して、ページを開き直してください。</p>';return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  $("#logout").onclick=()=>auth.signOut();
  auth.onAuthStateChanged(async u=>{
    if(!u){DATA=null;showLogin(pendingMsg);pendingMsg=null;return}
    $("#logout").hidden=false;
    try{await loadAll();renderHome()}
    catch(e){console.warn(e);pendingMsg=/permission/i.test(String(e&&(e.code||e.message)))?"このIDには管理者の権限がありません。管理者IDでログインしてください。":"データを読み込めませんでした。少し時間をおいてお試しください。";await auth.signOut()}
  });
})();
})();
</script>
</body>
</html>
