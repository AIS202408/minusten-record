<body>
<style>
/* Layout: one narrow app column (salon phone); silver gradient + charcoal + orange chevrons, taken from the MINUS TEN visuals */
:root{
  --bg:#ffffff; --surface:#f2f2f1; --line:#e1e0dd; --fg:#262523; --muted:#76746f;
  --gold:#3a3936; --gold-ink:#d9621f; --on-gold:#ffffff; --good:#4f7a52; --warn:#b5533c;
  --silver-a:#8e8e8d; --silver-b:#e9e9e8; --orange:#ed6a1f;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151514; --surface:#1f1f1e; --line:#363634; --fg:#efeeeb; --muted:#a6a39e;
  --gold:#ecebe7; --gold-ink:#ff8b4d; --on-gold:#181816; --good:#86b489; --warn:#e08a74; --silver-a:#4a4a49; --silver-b:#262625; --orange:#ff7a33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151514; --surface:#1f1f1e; --line:#363634; --fg:#efeeeb; --muted:#a6a39e;
  --gold:#ecebe7; --gold-ink:#ff8b4d; --on-gold:#181816; --good:#86b489; --warn:#e08a74; --silver-a:#4a4a49; --silver-b:#262625; --orange:#ff7a33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.app{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold-ink);text-transform:uppercase}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;letter-spacing:.04em}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;height:36px;min-width:36px;padding:0 12px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 20px;border-radius:4px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font-weight:700;letter-spacing:.06em;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.danger{border-color:var(--warn);background:transparent;color:var(--warn)}
.section{padding-block:22px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.section:last-child{border-bottom:none}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:17px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border:1px solid var(--gold);color:var(--gold-ink);border-radius:999px;letter-spacing:.06em;vertical-align:middle}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 12px}
.brandbar .logo{height:22px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(2.1)}}
:root[data-theme="dark"] .logo{filter:brightness(2.1)}
.hero{margin:0;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,var(--silver-a),var(--silver-b))}
.hero img{display:block;width:100%;height:auto}
.h-big{font-size:24px;letter-spacing:.04em}
.lead{margin:0;font-size:14px}
.ph{position:relative}
.pill{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:2px 12px;border-radius:6px;background:rgba(255,255,255,.82);color:#2a2926;font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.02em}
.pair figure{position:relative}
.chev{position:absolute;left:-17px;top:calc((100% - 46px)/2);width:26px;height:30px;z-index:2;pointer-events:none}
.top h1,.brandbar h1{color:var(--fg)}
/* list */
.clist{display:grid}
.crow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.crow img{width:64px;height:80px;object-fit:cover;border-radius:3px;background:var(--surface)}
.crow .nm{font-family:var(--f-display);font-size:17px;font-weight:600}
.crow .meta{font-size:13px;color:var(--muted)}
.crow .cnt{font-family:var(--f-display);font-size:26px;color:var(--gold-ink);text-align:right;line-height:1}
.crow .cnt small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.empty-ph{width:64px;height:80px;border:1px dashed var(--line);border-radius:3px}
/* compare */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;display:grid;gap:6px;min-width:0}
.pair .ph{aspect-ratio:3/4;max-width:100%;background:var(--surface);border-radius:4px;overflow:hidden}
.pair .ph img{width:100%;height:100%;object-fit:contain;display:block}
.pair figcaption{font-size:12px;text-align:center;color:var(--muted)}
.pair figcaption b{display:block;font-family:var(--f-display);font-size:15px;color:var(--fg)}
.pair figure.after figcaption b{color:var(--gold-ink)}
.cropbox{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:4px;overflow:hidden;touch-action:none;background:var(--surface);cursor:grab}
.cropbox canvas{width:100%;height:100%;display:block}
.cropgrid{position:absolute;inset:0;pointer-events:none;border:1px solid rgba(166,133,74,.7);
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(0deg,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.pickrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pickrow select{height:40px;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:0 8px;min-width:0}
.pickrow span{color:var(--gold-ink)}
input[type=range]{width:100%;accent-color:var(--gold)}
.delta{display:flex;gap:18px;flex-wrap:wrap}
.delta div{display:grid}
.delta b{font-family:var(--f-display);font-size:24px;font-weight:600}
.delta .up{color:var(--good)}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stamp{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--muted)}
.stamp.on{border-color:var(--gold);background:var(--gold);color:var(--on-gold)}
.stamp.next{border:1.5px dashed var(--gold);color:var(--gold-ink)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
/* timeline */
.tl{display:grid}
.tli{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.tli:last-child{border-bottom:none}
.tli img{width:56px;height:70px;object-fit:cover;border-radius:3px}
.tli .ttl{font-weight:700}
.tli .sub{font-size:13px;color:var(--muted)}
.tact{display:grid;gap:2px;justify-items:end}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12px;padding:4px 0;text-decoration:underline}
.linkbtn.warn{color:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{height:40px;padding:0 4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px;white-space:nowrap}
.tab[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--gold)}
.tab .ok{color:var(--good)}
.noph{width:100%;height:100%;display:grid;place-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:3px}
.tli .noph{width:56px;height:70px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(30px + env(safe-area-inset-bottom,0px))}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:13px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px 12px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--on-gold)}
.guide{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px;background:var(--surface);border-radius:4px}
.guide img{width:96px;height:120px;object-fit:cover;border-radius:3px}
.guide ul{margin:6px 0 0;padding-left:1.1em;font-size:13px}
.overlay{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;border-radius:4px;background:var(--surface)}
.overlay img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.note{font-size:12px;color:var(--muted)}
.shareimg{width:100%;border:1px solid var(--line);border-radius:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{padding:14px;border:1px solid var(--warn);border-radius:4px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:40}
.hero-note{padding:14px;background:var(--surface);border-radius:4px;font-size:13px}
</style>

<div class="app" id="app"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

  }

  for(let k=0;k<1100;k++){

      px=tx+(r()-.5)*14*p.frizz*p.frizz*4*t;py=ty+(r()-.5)*4*p.frizz;g.lineTo(px,py)}
    g.stroke();
  }

  g.globalCompositeOperation="screen";
  const band=g.createRadialGradient(300,300,10,300,300,260);
  band.addColorStop(0,`rgba(255,240,215,${p.gloss*.75})`);band.addColorStop(.5,`rgba(255,230,200,${p.gloss*.35})`);band.addColorStop(1,"rgba(255,230,200,0)");
  g.setTransform(1,0,0,.32,0,204);g.fillStyle=band;g.fillRect(0,0,W,H*3);g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation="source-over";g.restore();
  g.fillStyle="rgba(20,18,15,.55)";g.fillRect(W-150,H-46,134,30);g.fillStyle="#fff";g.font="16px sans-serif";g.fillText("サンプル画像",W-138,H-25);
  return sampleCache[i]=cv.toDataURL("image/jpeg",.85);
}
const srcOf=ph=>ph&&ph.startsWith("sample:")?sampleSrc(+ph.slice(7)):ph;

function analyze(img){
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  const w=120,h=Math.round(w*ih/iw)||160,cv=document.createElement("canvas");cv.width=w;cv.height=h;
  const g=cv.getContext("2d");g.drawImage(img,0,0,w,h);
  const d=g.getImageData(Math.round(w*.15),Math.round(h*.1),Math.round(w*.7),Math.round(h*.6));
  const L=[];for(let i=0;i<d.data.length;i+=4)L.push(.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2]);
  let diff=0,cnt=0;const ww=d.width;for(let i=1;i<L.length;i++){if(i%ww){diff+=Math.abs(L[i]-L[i-1]);cnt++}}
  const s=[...L].sort((a,b)=>a-b),med=s[s.length>>1],p98=s[Math.floor(s.length*.98)];
  const hl=(p98-med)/255,fr=diff/cnt/255;
  return Math.round(Math.max(0,Math.min(100,30+140*hl-300*fr)));
}
function loadFile(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const M=2000,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");
  cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  res(cv)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

    const toT=s=>Math.round(1000*Math.log(s/cr.sMin)/Math.log(cr.sMax/cr.sMin)),toS=t=>cr.sMin*Math.pow(cr.sMax/cr.sMin,t/1000);
    $("#ctrl").innerHTML=`<p class="note" style="margin:0">ドラッグで位置、2本指やスライダーで大きさを変えられます。</p>
      <div class="field"><label for="zm">写真の大きさ</label><input type="range" id="zm" min="0" max="1000" value="${toT(cr.s)}"></div>
      ${angPh(prev,st.angle)?`<div class="field"><label for="op">前回の写真を重ねる（大きさと位置を合わせる目安）</label><input type="range" id="op" min="0" max="80" value="${Math.round(cr.ga*100)}"></div>`:""}
      <div class="row2"><button class="btn ghost sm" id="fitAll">全体を表示</button><button class="btn ghost sm" id="fitFill">枠いっぱい</button></div>`;
    const setS=s=>{s=Math.max(cr.sMin,Math.min(cr.sMax,s));cr.cx=FW/2+(cr.cx-FW/2)*s/cr.s;cr.cy=FH/2+(cr.cy-FH/2)*s/cr.s;cr.s=s;$("#zm").value=toT(s);draw()};
    $("#zm").oninput=e=>setS(toS(+e.target.value));
    if($("#op"))$("#op").oninput=e=>{cr.ga=e.target.value/100;draw()};
    $("#fitAll").onclick=()=>{cr.cx=FW/2;cr.cy=FH/2;cr.s=cr.sMin;$("#zm").value=toT(cr.s);draw()};
    $("#fitFill").onclick=()=>{cr.cx=FW/2;cr.cy=FH/2;cr.s=cr.sCov;$("#zm").value=toT(cr.s);draw()};
    const cb=$("#cb"),pts=new Map();let pinch=0;
    const k=()=>FW/cb.getBoundingClientRect().width;
    cb.addEventListener("pointerdown",e=>{cb.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0});
    cb.addEventListener("pointermove",e=>{const p=pts.get(e.pointerId);if(!p)return;
      if(pts.size===1){cr.cx+=(e.clientX-p.x)*k();cr.cy+=(e.clientY-p.y)*k();p.x=e.clientX;p.y=e.clientY;draw();return}
      p.x=e.clientX;p.y=e.clientY;const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch)setS(cr.s*d/pinch);pinch=d});
    const end=e=>{pts.delete(e.pointerId);pinch=0};
    cb.addEventListener("pointerup",end);cb.addEventListener("pointercancel",end);
    cb.addEventListener("wheel",e=>{e.preventDefault();setS(cr.s*(e.deltaY<0?1.06:1/1.06))},{passive:false});
    draw();
  }
  const onPick=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const a=st.angle;
    try{const cv=await loadFile(f);st.crops[a]=makeCrop(cv,a);delete st.removed[a];if(st.angle===a){renderTabs();renderPanel()}}
    catch(err){toast("この画像は読み込めませんでした。JPEGかPNGの写真を選んでください。")}};
  $("#file").onchange=onPick;$("#file2").onchange=onPick;
  renderTabs();renderPanel();

  $("#sv").onclick=()=>{
    const ph={};
    ANGLES.forEach(([a])=>{ph[a]=st.crops[a]?clean(st.crops[a]).toDataURL("image/jpeg",.82):(editing&&!st.removed[a]&&angPh(editing,a))||null});
    if(!ph.back&&!ph.right&&!ph.left){const e=$("#err");e.hidden=false;e.textContent="少なくとも1枚、写真を撮るか選んでください。";return}
    const rec={date:$("#dt").value||today(),photo:ph.back,photoR:ph.right,photoL:ph.left,memo:$("#memo").value.trim()};
    if(editing)Object.assign(editing,rec);else c.visits.push({id:uid(),...rec,before:isB});
    sortV(c);
    save();closeSheet();if(!editing){view.a=0;view.b=c.visits.length-1}render();if(!editing)scrollTo(0,0);toast(editing?"保存しました":`${me}を記録しました`)};
  if(editing){
    const askDel=()=>{$("#delV").innerHTML=`<div class="confirm"><div>${me}の写真と記録をすべて削除します。元に戻せません。</div><div class="row2"><button class="btn ghost sm" id="dvN">やめる</button><button class="btn danger sm" id="dvY">削除する</button></div></div>`;
      $("#dvN").onclick=()=>{$("#delV").innerHTML='<button class="linkbtn warn" id="delVb">この回の写真と記録を削除</button>';$("#delVb").onclick=askDel};
      $("#dvY").onclick=()=>{c.visits=c.visits.filter(v=>v.id!==editing.id);view.a=0;view.b=Math.max(0,c.visits.length-1);save();closeSheet();render();toast("削除しました")}};
    $("#delVb").onclick=askDel;
  }
}

// ---------- share sheet ----------
function drawContain(g,img,x,y,w,h){g.fillStyle="#f1eee8";g.fillRect(x,y,w,h);const r=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*r,dh=img.naturalHeight*r;g.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function openShare(){
  const c=cust(),A=c.visits[view.a],B=c.visits[view.b],salon=S.salon||"",ang=view.angle;
  openSheet(`<div class="app"><header class="top"><button class="iconbtn" id="cx">閉じる</button><div style="text-align:right"><div class="eyebrow">${esc(c.name)} 様</div><h1>送る画像</h1></div></header>
    <section class="section"><div id="imgWrap"><p class="muted">画像をつくっています…</p></div>
      <div id="shareArea" style="display:grid;gap:8px"></div>
      <p class="note" id="shareNote">画像を長押しして保存し、LINEで送ってください。</p></section>
    <section class="section"><div class="field"><label for="msg">LINEに添えるメッセージ</label><textarea id="msg" rows="6"></textarea></div>
      <button class="btn block" id="cp">メッセージをコピー</button></section></div>`);
  $("#cx").onclick=closeSheet;
  const [ia,ib]=await Promise.all([loadImg(srcOf(angPh(A,ang)||mainPh(A))),loadImg(srcOf(angPh(B,ang)||mainPh(B)))]);
  await (document.fonts&&document.fonts.ready);
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const logo=await loadImg(LOGO);
  g.fillStyle="#ffffff";g.fillRect(0,0,W,H);
  const band=g.createLinearGradient(0,0,0,250);band.addColorStop(0,"#8c8c8b");band.addColorStop(1,"#e4e4e3");g.fillStyle=band;g.fillRect(0,0,W,250);
  g.textAlign="center";g.fillStyle="#ffffff";g.font="500 28px 'Zen Kaku Gothic New',sans-serif";g.fillText("MINUS TEN TREATMENT",W/2,92);
  g.save();g.shadowColor="rgba(255,236,200,.9)";g.shadowBlur=18;g.font="600 76px 'Shippori Mincho',serif";g.fillText("Before / After",W/2,182);g.restore();
  const pw=480,ph=640,py=290,lx=W/2-pw-6,rx=W/2+6;
  if(ia)drawContain(g,ia,lx,py,pw,ph);if(ib)drawContain(g,ib,rx,py,pw,ph);
  const pill=(t,cx)=>{g.font="600 40px 'Shippori Mincho',serif";const w=g.measureText(t).width+44;g.fillStyle="rgba(255,255,255,.85)";g.beginPath();g.roundRect?g.roundRect(cx-w/2,py+ph-78,w,58,10):g.rect(cx-w/2,py+ph-78,w,58);g.fill();g.fillStyle="#2a2926";g.textAlign="center";g.fillText(t,cx,py+ph-35)};
  pill("Before",lx+pw/2);pill("After",rx+pw/2);
  g.fillStyle="#ed6a1f";const cy0=py+ph/2,chev=x=>{g.beginPath();g.moveTo(x,cy0-36);g.lineTo(x+22,cy0-36);g.lineTo(x+48,cy0);g.lineTo(x+22,cy0+36);g.lineTo(x,cy0+36);g.lineTo(x+26,cy0);g.closePath();g.fill()};chev(W/2-40);chev(W/2-8);
  g.font="500 26px 'Zen Kaku Gothic New',sans-serif";g.textAlign="left";
  const tag=(t,x)=>{const w=g.measureText(t).width+28;g.fillStyle="rgba(30,30,28,.62)";g.fillRect(x,py,w,46);g.fillStyle="#fff";g.fillText(t,x+14,py+32)};
  tag(`${lab(c,view.a)} ${md(A.date)}`,lx);tag(`${lab(c,view.b)} ${md(B.date)}`,rx);
  g.textAlign="center";g.fillStyle="#262523";g.font="600 44px 'Shippori Mincho',serif";
  g.fillText(`${lab(c,view.a)}  →  ${lab(c,view.b)}`,W/2,py+ph+86);
  g.fillStyle="#76746f";g.font="400 28px 'Zen Kaku Gothic New',sans-serif";
  g.fillText(`${ANG[ang]}・トリートメント ${num(c,view.b)-num(c,view.a)}回分の変化`,W/2,py+ph+136);
  g.strokeStyle="#e1e0dd";g.lineWidth=2;g.beginPath();g.moveTo(140,H-170);g.lineTo(W-140,H-170);g.stroke();
  if(logo){const lw=300,lh=lw*logo.naturalHeight/logo.naturalWidth;g.drawImage(logo,W/2-lw/2,H-140,lw,lh)}
  g.fillStyle="#262523";g.font="600 34px 'Shippori Mincho',serif";g.fillText(salon||"サロン名（設定で入力）",W/2,H-48);
  const url=cv.toDataURL("image/jpeg",.9);
  $("#imgWrap").innerHTML=`<img class="shareimg" src="${url}" alt="ビフォアアフター比較画像">`;
  const left=Math.max(0,(S.goal||10)-c.visits.length);
  $("#msg").value=`${c.name.split(/\s/)[0]}様\n本日もありがとうございました${salon?"。"+salon+"です":""}。\n${lab(c,view.a)}と${lab(c,view.b)}の髪を比べてみました。ツヤやまとまりの変化をぜひご覧ください。\n続けるほど変化を実感していただけるので、次回もお待ちしています。`;
  const copyMsg=async()=>{try{await navigator.clipboard.writeText($("#msg").value);return true}catch(e){return false}};
  cv.toBlob(blob=>{if(!blob)return;const file=new File([blob],"minusten-before-after.jpg",{type:"image/jpeg"});
    let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
    if(!ok)return;
    $("#shareArea").innerHTML='<button class="btn block" id="shareBtn">LINEで送る（画像＋メッセージ）</button>';
    $("#shareNote").textContent="共有画面でLINEを選び、送る相手を選んでください。メッセージが付かないときは、トークに貼り付けてください（自動でコピーされます）。";
    $("#shareBtn").onclick=async()=>{await copyMsg();try{await navigator.share({files:[file],text:$("#msg").value})}catch(e){if(e&&e.name!=="AbortError")toast("共有できませんでした。画像を長押しして保存してください")}};
  },"image/jpeg",.9);
  $("#cp").onclick=async()=>{const t=$("#msg");try{await navigator.clipboard.writeText(t.value);toast("コピーしました")}catch(e){t.focus();t.select();toast("選択しました。コピーしてください")}};
}

// ---------- settings ----------
function openSettings(){
  openSheet(`<div class="app"><header class="top"><button class="iconbtn" id="cx">閉じる</button><h1>設定</h1></header>
    <section class="section">
      <div class="field"><label for="sn">サロン名（送る画像に入ります）</label><input id="sn" value="${esc(S.salon)}" placeholder="例：Hair Salon ○○"></div>
      <button class="btn block" id="ss">保存</button>
    </section>
    <section class="section"><h2 style="font-size:16px">写真の保存場所</h2>
      <p class="note" style="margin:0">写真と記録はこのスマホのブラウザの中だけに保存されます。他の端末やスタッフとは共有されません。試作版のため、大切な写真は別にも保存してください。</p>
      <div id="rs"><button class="linkbtn warn" id="rsb">すべて消してサンプルに戻す</button></div></section></div>`);
  $("#cx").onclick=closeSheet;
  $("#ss").onclick=()=>{S.salon=$("#sn").value.trim();save();closeSheet();render();toast("保存しました")};
  $("#rsb").onclick=()=>{$("#rs").innerHTML=`<div class="confirm"><div>撮影した写真と記録がすべて消えます。元に戻せません。</div><div class="row2"><button class="btn ghost sm" id="rN">やめる</button><button class="btn danger sm" id="rY">消す</button></div></div>`;
    $("#rN").onclick=openSettings;$("#rY").onclick=()=>{S=defaultState();save();closeSheet();view={name:"list"};render();toast("サンプルに戻しました")}};
}

function render(){view.name==="detail"?renderDetail():renderList()}
(async()=>{S=migrate(await load()||defaultState());render()})();
})();
</script>
